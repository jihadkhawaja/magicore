name: Publish MagiCore NuGet packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write
  id-token: write

env:
  PACKAGE_SOURCE: https://nuget.pkg.github.com/jihadkhawaja/index.json
  NUGET_SOURCE: https://api.nuget.org/v3/index.json

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore MagiCore.slnx

      - name: Build
        run: dotnet build MagiCore.slnx --configuration Release --no-restore

      - name: Test
        run: |
          dotnet test tests/MagiCore.Tests/MagiCore.Tests.csproj --configuration Release --no-restore
          dotnet test tests/MagiCore.NetStandard.Tests/MagiCore.NetStandard.Tests.csproj --configuration Release --no-restore

      - name: Validate release version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME. Expected vMAJOR.MINOR.PATCH or a SemVer prerelease." >&2
            exit 1
          fi

      - name: Pack
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          dotnet pack src/MagiCore/MagiCore.csproj \
            --configuration Release \
            --no-build \
            --output ./artifacts/package \
            -p:Version="$version" \
            -p:PackageVersion="$version"

      - name: Verify package versions
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          for package in artifacts/package/*.nupkg; do
            nuspec="$(unzip -p "$package" '*.nuspec' | tr -d '\r')"
            if ! grep -q "<version>$version</version>" <<< "$nuspec"; then
              echo "Package $package does not have version $version" >&2
              exit 1
            fi
          done

      - name: Publish to GitHub Packages
        run: dotnet nuget push ./artifacts/package/*.nupkg --source "$PACKAGE_SOURCE" --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate

      - name: Authenticate to NuGet.org with trusted publishing
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: jihadkhawaja

      - name: Publish to NuGet.org
        run: dotnet nuget push ./artifacts/package/*.nupkg --source "$NUGET_SOURCE" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --skip-duplicate
